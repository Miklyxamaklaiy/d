<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark">
  <title>Учебный вечер — карточка</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 40px; /* 🔹 расстояние между блоками (зеленые стрелки) */
      background: linear-gradient(180deg, #1b1236, #0b0e1a);
      color: #fff;
      font-family: "ALS Sector", system-ui, sans-serif;
    }

    /* все карточки теперь прямоугольные без скруглений */
    .block {
      width: 640px;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(180deg, #24104a, #1a0e3a);
      border: 2px solid rgba(200, 130, 255, 0.6);
      border-radius: 0; /* ⛔️ убираем скругления */
      box-shadow: none;
    }

    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 10px 26px;
      font-weight: 700;
      text-transform: uppercase;
      color: #00e5ff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }

    h1 {
      margin: 0;
      font-size: 48px;
      letter-spacing: 1px;
    }

    h1 span {
      color: #ea7cff;
    }

    .name {
      font-size: 40px;
      font-weight: 700;
      background: #fff;
      color: #0a0a0a;
      padding: 32px 20px;
      width: 480px;
      margin: 0 auto;
      border-radius: 0; /* ⛔️ убрано скругление */
      border: none;
    }

    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #ccc;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Блок 1: Верхний -->
  <div class="block">
    <div class="badge">МЕДИА</div>
    <div class="footer">Октябрь 2025</div>
  </div>

  <!-- Блок 2: Центральный -->
  <div class="block">
    <h1>УЧЕБНЫЙ <span>ВЕЧЕР</span></h1>
    <div class="name">Анастасия Черноусова</div>
  </div>

  <!-- Блок 3: Нижний -->
  <div class="block">
    <div class="badge">МЕДИА</div>
    <div class="footer">Октябрь 2025</div>
  </div>

</body>
</html>
