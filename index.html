<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark">
  <title>Учебный вечер — карточка</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @font-face {
      font-family: "ALS Sector";
      src: url("./ALS_Sector-Regular.otf") format("opentype");
      font-weight: 400;
    }
    @font-face {
      font-family: "ALS Sector";
      src: url("./ALS_Sector-Bold.otf") format("opentype");
      font-weight: 700;
    }
    html, body {
      height: 100%;
      background-color: #0b1020;
      font-family: "ALS Sector", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen bg-slate-950">
  <div class="relative w-[600px] h-[600px] rounded-3xl border-4 border-fuchsia-400 overflow-hidden shadow-2xl">
    <!-- фон -->
    <div class="absolute inset-0 bg-gradient-to-br from-[#0b1020] via-[#1c1f45] to-[#3b0f4c]"></div>
    <div class="absolute -top-24 -left-24 h-80 w-80 rounded-full blur-3xl opacity-30 bg-fuchsia-500"></div>
    <div class="absolute -bottom-24 -right-24 h-96 w-96 rounded-full blur-3xl opacity-25 bg-indigo-500"></div>

    <!-- контент -->
    <div class="relative flex flex-col items-center justify-center text-center h-full text-white px-8">
      <h1 class="text-5xl font-extrabold drop-shadow-[0_4px_24px_rgba(99,102,241,0.35)] leading-tight">
        УЧЕБНЫЙ<br><span class="text-fuchsia-300">ВЕЧЕР</span>
      </h1>
      <p class="mt-4 text-indigo-100/90 text-lg max-w-md">
        Поможем разобраться в пределах и полюбить их,<br>а также подготовиться к первому РК.
      </p>
      <div class="mt-6 flex flex-wrap justify-center gap-4 text-indigo-100/90">
        <div class="inline-flex items-center gap-2 bg-white/10 rounded-full px-4 py-2 border border-white/15">
          📅 10 октября
        </div>
        <div class="inline-flex items-center gap-2 bg-white/10 rounded-full px-4 py-2 border border-white/15">
          ⏰ 18:00
        </div>
      </div>
    </div>
  </div>
</body>
</html>
